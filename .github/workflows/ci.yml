name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4 # TODO pin to commit SHA before publishing
      - uses: dtolnay/rust-toolchain@1.85.1 # TODO pin to commit SHA before publishing
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace
      - name: Check third-party licence bundle is current
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/generate-third-party-licenses.ps1 -Check
      - name: Check dependency licences and bans (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2 # TODO pin to commit SHA before publishing
        with:
          command: check licenses bans
      # Opt-in end-to-end COM harness: the only test that drives the real class
      # factory, handler, IStream and isolated worker process together.
      - name: End-to-end COM harness
        env:
          PARQUET_PREVIEW_E2E: "1"
        run: cargo test --locked -p parquet-preview-windows --lib -- --nocapture full_preview_round_trip

  release:
    # Tagged releases only. Build the Windows artefacts with the deterministic,
    # offline script and attach dist/ (DLL, worker, CLI, licence documents and
    # SHA256SUMS) to the GitHub Release. The debug-only worker-path override is
    # absent from these release-profile binaries (L8).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4 # TODO pin to commit SHA before publishing
      - uses: dtolnay/rust-toolchain@1.85.1 # TODO pin to commit SHA before publishing
      # The build script builds with --offline, so populate the registry cache
      # on the fresh runner first.
      - name: Fetch dependencies for the offline build
        run: cargo fetch --locked
      - name: Build the Windows artefacts
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1
      - name: Attach dist/ to the release
        uses: softprops/action-gh-release@v2 # TODO pin to commit SHA before publishing
        with:
          files: |
            dist/**
