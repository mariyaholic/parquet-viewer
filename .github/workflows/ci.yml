name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4 # TODO pin to commit SHA before publishing
      - uses: dtolnay/rust-toolchain@1.85.1 # TODO pin to commit SHA before publishing
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace
      - name: Check third-party licence bundle is current
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/generate-third-party-licenses.ps1 -Check
