name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 tools/build_docs.py --check
      - run: python3 -m unittest discover -s tools -p 'test_docs.py'
      - run: python3 tools/validate_design.py
      - run: python3 -m unittest discover -s tools -p 'test_design.py'
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with:
          components: rustfmt, clippy
      - name: Add Windows SDK resource compiler
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $compiler) { throw "Windows SDK rc.exe was not found" }
          $compiler.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace
      - name: Native standalone control smoke
        shell: pwsh
        timeout-minutes: 3
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "MSVC developer tools were not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" >nul && cl /nologo /utf-8 /W3 /Fotarget\native-smoke.obj /Fetarget\native-smoke.exe crates\viewer-shell\tests\native-smoke.c user32.lib comctl32.lib gdi32.lib"
          if ($LASTEXITCODE -ne 0) { throw "Native smoke compilation failed" }
          Copy-Item assets/desktop-fonts target/debug/fonts -Recurse -Force
          New-Item -ItemType Directory -Force target/debug/help | Out-Null
          Copy-Item docs/USER-GUIDE.html target/debug/help/index.html -Force
          & target/native-smoke.exe 'target\debug\parquet-desktop.exe' 'tests\fixtures\trades.parquet' Parquet target '2024-01-01T00:00:00Z'
          if ($LASTEXITCODE -ne 0) { throw "Native standalone smoke failed" }
          & target/debug/parquet-preview-fixtures.exe '--browse' 'target/pages.parquet'
          if ($LASTEXITCODE -ne 0) { throw "Paging fixture generation failed" }
          & target/native-smoke.exe 'target\debug\parquet-desktop.exe' 'target\pages.parquet' Parquet target '0' '--browse'
          if ($LASTEXITCODE -ne 0) { throw "Native paging/search smoke failed" }
      # The offline inventory covers all locked targets, not only the MSVC
      # packages downloaded by the native build above.
      - name: Fetch locked dependencies for offline licence inventory
        run: cargo fetch --locked
      - name: Check third-party licence bundle is current
        shell: pwsh
        run: |
          foreach ($culture in @('en-US', 'tr-TR', 'sv-SE')) {
            [System.Globalization.CultureInfo]::CurrentCulture = [System.Globalization.CultureInfo]::GetCultureInfo($culture)
            & ./scripts/generate-third-party-licenses.ps1 -Check
            if ($LASTEXITCODE -ne 0) { throw "Licence check failed under $culture" }
          }
      # Opt-in end-to-end COM harness: the only test that drives the real class
      # factory, handler, IStream and isolated worker process together.
      - name: End-to-end COM harness
        env:
          PARQUET_PREVIEW_E2E: "1"
        run: cargo test --locked -p parquet-preview-windows --lib -- --nocapture full_preview_round_trip

  deny:
    # cargo-deny-action is container-based and only runs on Linux (proven by
    # the mh-ticker first CI run, run 41384343756: "Container action is only
    # supported on Linux"); it gets its own job instead of riding the Windows
    # one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check dependency licences and bans (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans

  release:
    # Tagged releases only. Build the Windows payload with the deterministic,
    # offline script and attach the single versioned zip (binaries, licence
    # documents, registration scripts and SHA256SUMS inside) plus the standalone
    # SHA256SUMS. The debug-only worker-path override is absent from these
    # release-profile binaries (L8).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
      # The build script builds with --offline, so populate the registry cache
      # on the fresh runner first.
      - name: Fetch dependencies for the offline build
        run: cargo fetch --locked
      - name: Add Windows SDK resource compiler
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $compiler) { throw "Windows SDK rc.exe was not found" }
          $compiler.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build the Windows artefacts
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -Version "${{ github.ref_name }}"
      - name: Attach the release zip
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/parquet-preview-*.zip
            dist/SHA256SUMS
