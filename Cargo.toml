[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/protocol",
    "crates/worker",
    "crates/cli",
    "crates/client",
    "crates/windows",
    "crates/fixtures",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
authors = ["Maria"]
repository = "https://github.com/mariyaholic/parquet-viewer"
publish = false

[workspace.dependencies]
parquet = { version = "58.0.0", default-features = false, features = [
    "arrow",
    "snap",
    "brotli",
    "flate2-zlib-rs",
    "lz4",
    "zstd",
] }
arrow-array = "58.0.0"
arrow-buffer = "58.0.0"
arrow-schema = "58.0.0"
bytes = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
strip = "symbols"
